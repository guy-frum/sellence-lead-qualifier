<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sellence — Buyer Profile</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
        background: #ece8e3;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        color: #1b2237;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background: #fdfcfa;
        border-radius: 28px;
        padding: 36px 34px 30px;
        box-shadow: 0 30px 80px rgba(27, 34, 55, 0.16);
    }

    /* Header */
    .header {
        display: flex;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 34px;
    }

    .avatar {
        flex-shrink: 0;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(150deg, #cf9d92 0%, #b97f72 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fdfcfa;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.9rem;
        font-weight: 600;
    }

    .heading { flex: 1; }

    .eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #b08a7f;
        font-weight: 600;
        margin-bottom: 2px;
    }

    .name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 2.5rem;
        line-height: 1.05;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .context {
        font-size: 1rem;
        color: #6c7184;
    }

    .day-pill {
        flex-shrink: 0;
        background: #f3e3dd;
        color: #b1796b;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.05rem;
        font-weight: 600;
        padding: 5px 16px;
        border-radius: 999px;
    }

    /* Signal rows */
    .signals { margin-bottom: 28px; }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        padding: 15px 0;
        border-bottom: 1px solid #efe9e3;
    }

    .row:last-child { border-bottom: none; }

    .label {
        font-size: 1.12rem;
        color: #41475c;
    }

    .value {
        font-size: 1.12rem;
        font-weight: 600;
        text-align: right;
        color: #1b2237;
    }

    /* Score */
    .score {
        background: #1b2237;
        border-radius: 18px;
        padding: 22px 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .score-copy { color: #cdd2e0; }

    .score-title {
        font-size: 0.74rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8f97ad;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .score-sub {
        font-size: 1.06rem;
        color: #eef0f6;
        line-height: 1.3;
    }

    .score-number {
        flex-shrink: 0;
        font-family: 'Cormorant Garamond', serif;
        font-weight: 700;
        color: #fdfcfa;
        white-space: nowrap;
    }

    .score-number .big { font-size: 3.1rem; }

    .score-number .max {
        font-size: 1.3rem;
        color: #8f97ad;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="avatar">N</div>
            <div class="heading">
                <div class="eyebrow">Inquiry</div>
                <div class="name">Natasha</div>
                <div class="context">Online Course · Day 3</div>
            </div>
            <div class="day-pill">Day 3</div>
        </div>

        <div class="signals">
            <div class="row">
                <span class="label">Buyer Intent</span>
                <span class="value">High — actively comparing</span>
            </div>
            <div class="row">
                <span class="label">Decision Stage</span>
                <span class="value">Needs partner sign-off</span>
            </div>
            <div class="row">
                <span class="label">Best Channel</span>
                <span class="value">SMS — evening window</span>
            </div>
            <div class="row">
                <span class="label">Real Objection</span>
                <span class="value">Trust, not price</span>
            </div>
        </div>

        <div class="score">
            <div class="score-copy">
                <div class="score-title">Persuasion Score</div>
                <div class="score-sub">Ready for the closing message</div>
            </div>
            <div class="score-number">
                <span class="big">88</span><span class="max">/100</span>
            </div>
        </div>
    </div>
</body>
</html>
